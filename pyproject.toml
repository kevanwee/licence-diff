[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "licence-diff"
version = "0.1.0"
description = "Evidence-linked licence diff with deterministic checks and review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
licence-diff = "licence_diff.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
licence_diff = ["assets/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
