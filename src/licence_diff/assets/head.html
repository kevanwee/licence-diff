<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Evidence review</title><style>
:root{color-scheme:light;--ink:#1e343c;--muted:#4e636a;--accent:#225c72;--line:#cdd9dc;--paper:#fff;--wash:#f1f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.65 system-ui,sans-serif}
header,main{max-width:1120px;margin:auto;padding:32px}header{padding-top:48px;padding-bottom:12px}
h1{font:normal clamp(30px,4vw,42px)/1.2 Georgia,serif;max-width:30ch;margin:0 0 18px;text-wrap:balance}
h2{font-size:24px;margin:0 0 18px}h3{font-size:18px;line-height:1.5;margin:0 0 8px}h4{font-size:14px;margin:0 0 10px}
p{max-width:75ch;margin:8px 0 18px}.notice{background:#e0ecea;padding:12px 16px;border-radius:8px}.boundary,.meta,small{color:var(--muted)}.meta{font-size:13px}
section{margin:0 0 40px}article{padding:24px;background:var(--paper);border-top:1px solid var(--line)}
.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin:20px 0}.comparison>div{min-width:0}
pre{margin:0;padding:16px;background:var(--wash);white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}
blockquote{margin:16px 0;font:18px/1.7 Georgia,serif;max-width:70ch}details{padding:12px 0;border-top:1px solid var(--line);margin:12px 0}summary{color:var(--accent);cursor:pointer;font-weight:600}
details pre{margin-top:12px}label{display:block;font-weight:600;margin:18px 0 8px}input,select,textarea{display:block;width:100%;max-width:760px;padding:11px 12px;font:inherit;color:var(--ink);background:white;border:1px solid #879ea6;border-radius:5px;margin-top:7px;caret-color:var(--accent)}select{max-width:360px}
button{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:5px;padding:13px 18px;cursor:pointer;font:600 15px system-ui;margin-top:18px}button:hover{filter:brightness(.85)}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #926b1e;outline-offset:3px}::selection{background:#c5e3eb}a{color:var(--accent);text-underline-offset:3px}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:13px}code{overflow-wrap:anywhere}.plan{display:block;width:100%;height:auto;border:1px solid var(--line)}.filter{font-size:14px;margin-bottom:20px}.filter input{max-width:100%}#status{color:var(--muted)}
@media(max-width:650px){header,main{padding:22px}header{padding-top:30px}.comparison{grid-template-columns:1fr;gap:16px}article{padding:18px}pre{font-size:12px}}
@media print{body{background:white}form,.filter,article>label{display:none}header,main{max-width:none;padding:12px}article{break-inside:avoid}details{break-inside:avoid}}
</style></head><body>
